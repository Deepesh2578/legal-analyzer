services:
  postgres:
    image: postgres:15-alpine
    container_name: legal_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: legal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d legal_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  backend:
    build: ./backend
    container_name: legal_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/legal_db
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - legal_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: legal_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - legal_network

volumes:
  postgres_data:

networks:
  legal_network:
